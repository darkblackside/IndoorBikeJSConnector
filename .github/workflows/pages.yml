# The app lives on the game server (https://sweat-games.lightwhiteside.de, the container from docker.yml). GitHub
# Pages only redirects the old addresses there (https://darkblackside.github.io/IndoorBikeJSConnector/<page>/),
# built by scripts/pages-redirect.mjs. Repository variable SERVER_ORIGIN overrides the target.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push replaces a queued one, a running deployment finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/pages-redirect.mjs pages-dist "$SERVER_ORIGIN"
        env:
          SERVER_ORIGIN: ${{ vars.SERVER_ORIGIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
