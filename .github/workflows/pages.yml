# Publishes the web app (apps/web) (game hub, Zombie Ramp, hidden /debug/ bench) to GitHub Pages on every push to main:
# https://darkblackside.github.io/IndoorBikeJSConnector/ (Zombie Ramp under /zombie-ramp/, debug bench under /debug/).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push replaces a queued one, a running deployment finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # @darkblackside/ui (web UI) comes from GitHub Packages (NODE_AUTH_TOKEN at npm ci)
          registry-url: https://npm.pkg.github.com
          scope: "@darkblackside"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      # Relative asset URLs (vite base "./"), so the pages work under /IndoorBikeJSConnector/.
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
