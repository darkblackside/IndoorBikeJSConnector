<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Indoor Bike Connector</title>
  </head>
  <body>
    <header>
      <h1>Indoor Bike Connector</h1>
      <p id="unsupported" class="warning" hidden>
        This browser does not support Web Bluetooth. Use Chrome or Edge on desktop or Android
        (or Bluefy on iOS), served from <code>localhost</code> or HTTPS.
      </p>
    </header>

    <section class="devices">
      <div class="device">
        <span class="dot" data-status-dot="trainer"></span>
        <span data-status-text="trainer">Trainer: disconnected</span>
        <button id="connect-trainer" type="button">Connect trainer</button>
      </div>
      <div class="device">
        <span class="dot" data-status-dot="heartRateMonitor"></span>
        <span data-status-text="heartRateMonitor">Heart rate: disconnected</span>
        <button id="connect-hrm" type="button">Connect heart rate</button>
      </div>
    </section>

    <section class="metrics">
      <div class="metric"><span class="label">Power</span><span class="value" id="power">–</span><span class="unit">W</span></div>
      <div class="metric"><span class="label">Cadence</span><span class="value" id="cadence">–</span><span class="unit">rpm</span></div>
      <div class="metric"><span class="label">Speed</span><span class="value" id="speed">–</span><span class="unit">km/h</span></div>
      <div class="metric"><span class="label">Heart rate</span><span class="value" id="heartRate">–</span><span class="unit">bpm</span></div>
    </section>

    <section class="control">
      <h2>ERG target <span id="erg-state" class="badge">off</span></h2>
      <div class="target">
        <button type="button" data-step="-10">−10</button>
        <input id="target" type="number" min="0" max="2000" step="5" inputmode="numeric" placeholder="watts" />
        <button type="button" data-step="10">+10</button>
        <button id="target-set" type="button">Set</button>
        <button id="target-off" type="button">Free ride</button>
      </div>
      <p class="hint"><span id="target-ftp">–</span> of FTP <label>FTP <input id="ftp" type="number" min="50" max="600" step="1" /> W</label> <span id="power-range"></span></p>
    </section>

    <section>
      <h2>Log</h2>
      <pre id="log"></pre>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
